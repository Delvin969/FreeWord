<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FreeWord</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="ribbon">
    <div class="group">
      <select id="fontName" title="Font">
        <option>Calibri</option>
        <option>Arial</option>
        <option>Georgia</option>
        <option>Times New Roman</option>
        <option>Courier New</option>
        <option>Verdana</option>
      </select>
      <select id="fontSize" title="Size">
        <option>10</option><option>11</option><option selected>12</option>
        <option>14</option><option>16</option><option>18</option>
        <option>24</option><option>28</option><option>36</option>
      </select>
    </div>
    <div class="group">
      <button data-cmd="bold"><b>B</b></button>
      <button data-cmd="italic"><i>I</i></button>
      <button data-cmd="underline"><u>U</u></button>
      <button data-cmd="strikeThrough"><s>S</s></button>
    </div>
    <div class="group">
      <button data-cmd="justifyLeft">⇤</button>
      <button data-cmd="justifyCenter">≡</button>
      <button data-cmd="justifyRight">⇥</button>
      <button data-cmd="justifyFull">☰</button>
    </div>
    <div class="group">
      <button data-cmd="insertUnorderedList">• List</button>
      <button data-cmd="insertOrderedList">1. List</button>
      <button data-cmd="indent">Indent →</button>
      <button data-cmd="outdent">← Outdent</button>
    </div>
    <div class="group">
      <select id="blockFormat" title="Style">
        <option value="P">Normal</option>
        <option value="H1">Heading 1</option>
        <option value="H2">Heading 2</option>
        <option value="H3">Heading 3</option>
        <option value="PRE">Code</option>
      </select>
      <input type="color" id="foreColor" title="Text color" value="#000000" />
      <input type="color" id="hiliteColor" title="Highlight" value="#ffff00" />
    </div>
    <div class="group">
      <button id="insertTableBtn">Table</button>
      <button id="insertLinkBtn">Link</button>
      <button data-cmd="undo">↶</button>
      <button data-cmd="redo">↷</button>
    </div>
    <div class="group">
      <button id="newBtn">New</button>
      <button id="openBtn">Open</button>
      <button id="saveBtn">Save</button>
      <button id="saveAsBtn">Save As .docx</button>
    </div>
  </div>

  <div id="statusbar">
    <span id="statusText">Untitled document</span>
    <span id="wordCount">0 words</span>
  </div>

  <div id="page-wrap">
    <div id="editor" contenteditable="true" spellcheck="true">
      <p>Start typing your document here...</p>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
